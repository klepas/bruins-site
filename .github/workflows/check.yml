# Checks every push and pull request: Bruin's Markdown, the content
# check's own self-test, a production build, every live URL and jekyll
# doctor. On master, the deploy job then copies the checked build to the
# S3 bucket that serves the site.
name: Check

on:
  push:
  pull_request:

# Each job names the permissions it needs, so a new job starts with none.
permissions: {}

# For the notice jobs at the end. GitHub emails only the person whose push
# started a run, which on master is usually Bruin. So on master a failed
# check or deploy opens an issue assigned to NOTIFY_LOGIN, or comments on
# the one already open, and the next passing push closes it. Each file the
# content check warns about gets an issue of its own, closed once the file
# has no warning. Assignment is what notifies, so no issue text has an
# @-mention.
env:
  NOTIFY_LOGIN: klepas
  ISSUE_TITLE: The site check or deploy failed on master

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      linted: ${{ steps.warnings.outputs.linted }}
      warnings: ${{ steps.warnings.outputs.warnings }}
    steps:
      # No later step uses git, so the token isn't kept in .git/config,
      # where the gems' code could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Check the content
        id: content
        run: |
          set -o pipefail
          bundle exec ruby _scripts/check-content.rb | tee "$RUNNER_TEMP/content.txt"
      # Warnings don't fail the check, so this passes them on to the
      # warning-notices job. It does so only if the content check finished:
      # it passed, or it failed with an error line. The script prints its
      # findings once it has read every file, so a crash prints none, and an
      # empty list would close every warning issue.
      - name: Pass the content warnings on
        id: warnings
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.content.outcome }}
        run: |
          out="$RUNNER_TEMP/content.txt"
          case "$OUTCOME" in
            success) ;;
            failure) grep -Ev '^[^:]+:[0-9]+: warning: ' "$out" | grep -Eq '^[^:]+:[0-9]+: ' || exit 0 ;;
            *) exit 0 ;;
          esac
          delim="end_of_warnings_$RANDOM$RANDOM"
          {
            echo "linted=true"
            echo "warnings<<$delim"
            grep -E '^[^:]+:[0-9]+: warning: ' "$out" || true
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      - name: Self-test the content check
        run: bundle exec ruby _scripts/check-content.rb --self-test
      - name: Build
        run: bundle exec jekyll build --destination "$RUNNER_TEMP/site"
      - name: Check every live URL still builds
        run: ruby _scripts/check-urls.rb _scripts/live-url-inventory.tsv "$RUNNER_TEMP/site"
      - name: Doctor
        run: bundle exec jekyll doctor
      # The deploy job copies exactly this build, so on master it's kept as
      # an artifact for a day. overwrite replaces any site artifact this run
      # already has, so the upload can't fail on the name. Without
      # include-hidden-files, the action would leave out .well-known/, as it
      # does every name that starts with a dot.
      - name: Keep the build for the deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ runner.temp }}/site
          retention-days: 1
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true

  # Copies the checked build to the bucket. AWS lets only a run on this
  # repo's master take the deploy role, through GitHub's OIDC token, so no
  # AWS key is stored anywhere. One deploy runs at a time, and a run whose
  # commit is no longer master's tip leaves the upload to the newer run, so
  # an older build never overwrites a newer one.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      BUCKET: www.cbchristensen.net
    steps:
      - name: Check this commit is still master's tip
        id: tip
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          ref=$(git ls-remote --exit-code "$REPO_URL" refs/heads/master)
          tip=$(printf '%s\n' "$ref" | cut -f1)
          if [ "$tip" = "$SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::master is now at $tip, so its run deploys instead."
          fi
      - uses: actions/download-artifact@v8
        if: steps.tip.outputs.deploy == 'true'
        with:
          name: site
          path: site
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.tip.outputs.deploy == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true
      # no-cache makes browsers ask S3 each time whether a file changed, so
      # an edit shows on the next page load. --delete removes what the
      # build no longer makes, so a file deleted or renamed in the repo
      # leaves the site too.
      - name: Upload to S3
        if: steps.tip.outputs.deploy == 'true'
        run: |
          test -f site/index.html
          aws s3 sync site "s3://$BUCKET" --no-progress --cache-control no-cache --delete

  # Separate jobs, so the build steps never hold a token that can write
  # issues. Each expression reaches its script through env:, never pasted
  # into the script itself, so text from a push can't run as a command.
  notify:
    needs: [check, deploy]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Tell the user the check or deploy failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          PUSHER: ${{ github.actor }}
        run: |
          body="The check or the deploy failed on master. The run shows which step failed and why.

          - Run: $RUN_URL
          - Commit: $COMMIT_URL
          - Pushed by: $PUSHER"
          open=$(gh issue list --state open --limit 200 --json number,title)
          number=$(jq -r --arg title "$ISSUE_TITLE" 'map(select(.title == $title)) | first | .number // empty' <<< "$open")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --assignee "$NOTIFY_LOGIN" --body "$body"
          fi

  close-notice:
    needs: [check, deploy]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Close the notice once master passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          PUSHER: ${{ github.actor }}
        run: |
          open=$(gh issue list --state open --limit 200 --json number,title)
          number=$(jq -r --arg title "$ISSUE_TITLE" 'map(select(.title == $title)) | first | .number // empty' <<< "$open")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The check and the deploy passed on master again.

          - Run: $RUN_URL
          - Commit: $COMMIT_URL
          - Pushed by: $PUSHER"
          fi

  # One issue per file with warnings, on every push to master where the
  # content check finished, pass or fail. A file gets one issue while it has
  # warnings, with no comment on later pushes, and the issue closes once the
  # file has none: fixed, renamed or deleted.
  warning-notices:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled() && needs.check.outputs.linted == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or close an issue for each file with warnings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          PUSHER: ${{ github.actor }}
          WARNINGS: ${{ needs.check.outputs.warnings }}
        run: |
          prefix="Warning in "
          warned=$(printf '%s\n' "$WARNINGS" | grep -E '^[^:]+:[0-9]+: warning: ' | cut -d: -f1 | sort -u)
          open=$(gh issue list --state open --limit 200 --json number,title)
          printf '%s\n' "$warned" | while IFS= read -r file; do
            [ -n "$file" ] || continue
            jq -e --arg title "$prefix$file" 'any(.[]; .title == $title)' <<< "$open" > /dev/null && continue
            lines=$(printf '%s\n' "$WARNINGS" | FILE="$file" awk 'index($0, ENVIRON["FILE"] ":") == 1 { print "    " $0 }')
            gh issue create --title "$prefix$file" --assignee "$NOTIFY_LOGIN" --body "The content check warns about this file. A warning doesn't fail the check, and Pep will look at it.

          $lines

          - Run: $RUN_URL
          - Commit: $COMMIT_URL
          - Pushed by: $PUSHER"
          done
          jq -r --arg prefix "$prefix" '.[] | select(.title | startswith($prefix)) | "\(.number) \(.title | ltrimstr($prefix))"' <<< "$open" |
            while read -r number file; do
              printf '%s\n' "$warned" | grep -qxF -- "$file" && continue
              gh issue close "$number" --comment "This file has no warnings now.

          - Run: $RUN_URL
          - Commit: $COMMIT_URL
          - Pushed by: $PUSHER"
            done
