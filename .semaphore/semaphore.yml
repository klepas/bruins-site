version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: r1-standard-2
    os_image: ubuntu2004
fail_fast:
  stop:
    when: branch != 'master'
auto_cancel:
  running:
    when: branch != 'master'
  queued:
    when: branch = 'master'
blocks:
  - name: "\U0001F9EA Test"
    dependencies: []
    task:
      jobs:
        - name: Bundle install and Jekyll Build
          commands:
            - checkout
            - sem-version ruby 2.6
            - bundle install
            - bundle exec jekyll build
  - name: "\U0001F680 Deploy"
    dependencies:
      - "\U0001F9EA Test"
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - echo "Building application..."
            - echo "Running security checks..."
            - echo "Deploying to production..."
            - echo "Deployment completed successfully!"
