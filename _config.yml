title: Carleton B. Christensen
lang: en-AU
description: >-
  This is the personal website of Carleton B. Christensen, AKA Bruin
  Christensen. Please visit the site and download anything of interest to you!
url: "http://www.cbchristensen.net"
timezone: UTC
permalink: date
# Bruin works in Canberra, 10 or 11 hours ahead of UTC. A paper dated today
# and committed in the morning is still in the future in UTC, and Jekyll
# would leave it out without an error.
future: true
# Stop the build on a top block YAML can't read, rather than publish the
# page at a URL with the build day's date.
strict_front_matter: true
markdown: kramdown

kramdown:
  # kramdown's own syntax, which the site has always used. Jekyll 4's
  # default, GFM, gives headings different ids and renders some of the
  # content differently. See README.md for what it means when writing.
  input: kramdown
  # U+FE0E keeps iOS from drawing the backlink arrow as an emoji
  footnote_backlink: "&#8617;&#xFE0E;"

sass:
  sourcemap: never

exclude:
  - refs/
  - plans/
  - AGENTS.md
  - CLAUDE.md
  - README.md
