<header class="site-header" id="top"{% include interface-lang.html %}>
  <div class="wrapper">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {%- for link in site.data.navigation %}
        {%- assign start = page.url | slice: 0, link.url.size %}
        <li><a href="{{ link.url | relative_url }}"
          {%- if page.url == link.url %} aria-current="page"
          {%- elsif start == link.url %} aria-current="true"{% endif %}>{{ link.title | escape }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
